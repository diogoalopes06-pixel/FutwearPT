name: Fix order email notifications

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Apply order email fixes
        shell: python
        run: |
          from pathlib import Path

          email_path = Path("backend/email_service.py")
          email_text = email_path.read_text(encoding="utf-8")
          marker = "\n\nasync def send_admin_order_status_update(order: dict, site_url: str = \"\"):\n"
          if marker not in email_text:
              email_text += marker + '''    admin_email = os.environ.get("ADMIN_NOTIFICATION_EMAIL") or os.environ.get("ADMIN_EMAIL")
    if not admin_email:
        return {"sent": False, "reason": "no_admin_email"}
    status = order.get("status", "pending")
    label = STATUS_LABELS.get(status, status)
    intro = STATUS_INTROS.get(status, "O estado da encomenda foi atualizado pela nossa equipa.")
    body = f"""
    <div style="background:#F5F2EA;padding:16px 20px;font-size:14px;color:#6B635E;line-height:1.6;margin-bottom:16px;">
        <p style="margin:0;"><strong style="color:#2C2724;">Cliente:</strong> {order.get("customer_name", "Cliente")}</p>
        <p style="margin:4px 0 0 0;"><strong style="color:#2C2724;">Referência:</strong> #{order.get("id", "")[:8].upper()}</p>
        <p style="margin:4px 0 0 0;"><strong style="color:#2C2724;">Novo estado:</strong> {label}</p>
    </div>
    {_build_order_summary(order)}
    """
    html = _wrap(
        title=f"Estado atualizado · #{order.get('id', '')[:8].upper()}",
        intro=intro,
        body_html=body,
    )
    subject = f"Atualização encomenda #{order.get('id', '')[:8].upper()} · {label}"
    return await send_email(admin_email, subject, html)


async def send_admin_payment_update(order: dict, site_url: str = ""):
    admin_email = os.environ.get("ADMIN_NOTIFICATION_EMAIL") or os.environ.get("ADMIN_EMAIL")
    if not admin_email:
        return {"sent": False, "reason": "no_admin_email"}
    payment_status = order.get("payment_status", "pending")
    body = f"""
    <div style="background:#F5F2EA;padding:16px 20px;font-size:14px;color:#6B635E;line-height:1.6;margin-bottom:16px;">
        <p style="margin:0;"><strong style="color:#2C2724;">Cliente:</strong> {order.get("customer_name", "Cliente")}</p>
        <p style="margin:4px 0 0 0;"><strong style="color:#2C2724;">Referência:</strong> #{order.get("id", "")[:8].upper()}</p>
        <p style="margin:4px 0 0 0;"><strong style="color:#2C2724;">Pagamento:</strong> {payment_status}</p>
    </div>
    {_build_order_summary(order)}
    """
    html = _wrap(
        title=f"Pagamento atualizado · #{order.get('id', '')[:8].upper()}",
        intro="O estado de pagamento de uma encomenda foi atualizado no painel.",
        body_html=body,
    )
    subject = f"Pagamento encomenda #{order.get('id', '')[:8].upper()} · {payment_status}"
    return await send_email(admin_email, subject, html)
'''
              email_path.write_text(email_text, encoding="utf-8")

          server_path = Path("backend/server.py")
          server_text = server_path.read_text(encoding="utf-8")
          old_import = "from email_service import send_order_confirmation, send_order_ready, send_admin_new_order, send_order_status_update, send_payment_confirmed, send_password_reset_email"
          new_import = "from email_service import send_order_confirmation, send_order_ready, send_admin_new_order, send_order_status_update, send_payment_confirmed, send_password_reset_email, send_admin_order_status_update, send_admin_payment_update"
          if old_import in server_text:
              server_text = server_text.replace(old_import, new_import, 1)
          old_status = "        background.add_task(send_order_status_update, doc)\n"
          new_status = "        background.add_task(send_order_status_update, doc)\n        background.add_task(send_admin_order_status_update, doc)\n"
          if old_status in server_text and "send_admin_order_status_update, doc" not in server_text:
              server_text = server_text.replace(old_status, new_status, 1)
          old_payment = "    if data.payment_status == \"paid\" and doc.get(\"email\"):\n        background.add_task(send_payment_confirmed, doc)\n"
          new_payment = "    if data.payment_status == \"paid\" and doc.get(\"email\"):\n        background.add_task(send_payment_confirmed, doc)\n    if data.payment_status in [\"pending\", \"paid\", \"failed\", \"refunded\"]:\n        background.add_task(send_admin_payment_update, doc)\n"
          if old_payment in server_text and "send_admin_payment_update, doc" not in server_text:
              server_text = server_text.replace(old_payment, new_payment, 1)
          server_path.write_text(server_text, encoding="utf-8")

      - name: Commit fixes and remove temporary workflow
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm -f .github/workflows/fix-order-emails.yml
          git add backend/server.py backend/email_service.py .github/workflows/fix-order-emails.yml
          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git commit -m "Send order updates to shop email"
          git push
